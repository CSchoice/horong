# Hostname 감지 실패 해결
spring.cloud.inetutils.preferred-networks: 192.168.1
spring.cloud.inetutils.timeout-seconds: 3

# Spring Security– 임시 비밀번호 생성 방지
spring.security.user.name: admin
spring.security.user.password: ${ADMIN_PASSWORD:securepassword}
spring.security.user.roles: ADMIN

# 액틀에이터 설정
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.show-details: when_authorized
management.endpoint.health.roles: ADMIN
spring:
  cache:
    type: redis
  application:
    name: horong
  # 카프카 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:horong-group}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      acks: ${KAFKA_PRODUCER_ACKS:all}
      retries: ${KAFKA_PRODUCER_RETRIES:3}
      batch-size: ${KAFKA_PRODUCER_BATCH_SIZE:16384}
      linger-ms: ${KAFKA_PRODUCER_LINGER_MS:5}
      compression-type: ${KAFKA_PRODUCER_COMPRESSION_TYPE:gzip}
  mail:
    host: ${GMAIL_HOST}
    port: ${GMAIL_PORT}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      cluster:
        max-redirects: 6
        nodes: ${REDIS_NODES}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 8
          max-wait: 20000
  elasticsearch:
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
    uris: ${ELASTICSEARCH_URIS}

  graphql:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:*}
      allowed-methods: ${ALLOWED_METHODS:*}
      allowed-headers: ${ALLOWED_HEADERS:Origin,Access-Control-Allow-Origin}
      exposed-headers: ${EXPOSED_HEADERS:Authorization,Content-Type}
      allow-credentials: ${ALLOWED_CREDENTIALS:true}
      one-hour: 3600
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret-key: ${SECRET_KEY}
  access-token-exp: ${ACCESS_TOKEN_EXP}
  refresh-token-exp: ${REFRESH_TOKEN_EXP}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    region:
      static-region: ${S3_REGION}
    credentials:
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}

# Rate Limiting 설정
rate-limit:
  enabled: true
  rules:
    # 인증/로그인 API
    - name: auth
      path-pattern: /api/auth/**
      capacity: 10
      refill-tokens: 10
      refill-duration-sec: 60
      type: IP
    
    # 일반 API
    - name: general
      path-pattern: /api/**
      capacity: 100
      refill-tokens: 100
      refill-duration-sec: 60
      type: USER
    
    # 검색 API (더 제한적)
    - name: search
      path-pattern: /api/search/**
      capacity: 20
      refill-tokens: 20
      refill-duration-sec: 60
      type: USER

# 암호화 설정
crypto:
  enabled: true
  secret-key: ${CRYPTO_SECRET_KEY:1234567890abcdef1234567890abcdef} # 32바이트 비밀키 (환경변수로 설정하거나 프로덕션에서는 Vault 등 사용 권장)

