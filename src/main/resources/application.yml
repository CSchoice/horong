spring:
  cloud:
    inetutils:
      preferred-networks: ${INETUTILS_PREFERRED_NETWORKS}
      timeout-seconds: ${INETUTILS_TIMEOUT_SECONDS}

  security:
    user:
      name: ${PROMETHEUS_USERNAME}
      password: ${PROMETHEUS_PASSWORD}
      roles: ${PROMETHEUS_ROLES}


  cache:
    type: ${CACHE_TYPE}

  application:
    name: ${APPLICATION_NAME}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET}
      key-deserializer: ${KAFKA_CONSUMER_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_CONSUMER_VALUE_DESERIALIZER}
    producer:
      key-serializer: ${KAFKA_PRODUCER_KEY_SERIALIZER}
      value-serializer: ${KAFKA_PRODUCER_VALUE_SERIALIZER}
      acks: ${KAFKA_PRODUCER_ACKS}
      retries: ${KAFKA_PRODUCER_RETRIES}
      batch-size: ${KAFKA_PRODUCER_BATCH_SIZE}
      linger-ms: ${KAFKA_PRODUCER_LINGER_MS}
      compression-type: ${KAFKA_PRODUCER_COMPRESSION_TYPE}

  mail:
    host: ${GMAIL_HOST}
    port: ${GMAIL_PORT}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      cluster:
        max-redirects: 6
        nodes: ${REDIS_NODES}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 8
          max-wait: 20000

  elasticsearch:
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
    uris: ${ELASTICSEARCH_URIS}

  graphql:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS}
      allowed-methods: ${ALLOWED_METHODS}
      allowed-headers: ${ALLOWED_HEADERS}
      exposed-headers: ${EXPOSED_HEADERS}
      allow-credentials: ${ALLOWED_CREDENTIALS}
      one-hour: ${ONE_HOUR:3600}

  servlet:
    multipart:
      enabled: ${MULTIPART_ENABLED}
      max-file-size: ${MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS}
      roles: ${MANAGEMENT_HEALTH_ROLES}

jwt:
  secret-key: ${SECRET_KEY}
  access-token-exp: ${ACCESS_TOKEN_EXP}
  refresh-token-exp: ${REFRESH_TOKEN_EXP}

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    region:
      static-region: ${S3_REGION}
    credentials:
      accessKey: ${S3_ACCESS_KEY}
      secretKey: ${S3_SECRET_KEY}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED}
  rules:
    - name: auth
      path-pattern: ${RATE_LIMIT_AUTH_PATH}
      capacity: ${RATE_LIMIT_AUTH_CAPACITY}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS}
      refill-duration-sec: ${RATE_LIMIT_AUTH_REFILL_DURATION}
      type: ${RATE_LIMIT_AUTH_TYPE}
    - name: general
      path-pattern: ${RATE_LIMIT_GENERAL_PATH}
      capacity: ${RATE_LIMIT_GENERAL_CAPACITY}
      refill-tokens: ${RATE_LIMIT_GENERAL_REFILL_TOKENS}
      refill-duration-sec: ${RATE_LIMIT_GENERAL_REFILL_DURATION}
      type: ${RATE_LIMIT_GENERAL_TYPE}
    - name: search
      path-pattern: ${RATE_LIMIT_SEARCH_PATH}
      capacity: ${RATE_LIMIT_SEARCH_CAPACITY}
      refill-tokens: ${RATE_LIMIT_SEARCH_REFILL_TOKENS}
      refill-duration-sec: ${RATE_LIMIT_SEARCH_REFILL_DURATION}
      type: ${RATE_LIMIT_SEARCH_TYPE}

crypto:
  enabled: ${CRYPTO_ENABLED}
  secret-key: ${CRYPTO_SECRET_KEY}
